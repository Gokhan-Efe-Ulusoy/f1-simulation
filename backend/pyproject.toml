[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-simulation"
version = "0.1.0"
description = "Formula 1 Simulation Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
]
performance = [
    "numba>=0.58.0",
    "psutil>=5.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []
fixable = ["E", "W", "F", "I", "B", "C4", "UP"]
unfixable = []
exclude = [".venv", "venv", "__pycache__", ".mypy_cache", ".ruff_cache", "dist", "build"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true
exclude = [".venv", "venv", "__pycache__", ".mypy_cache", ".ruff_cache", "dist", "build"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "unit: fast isolated unit tests (no data, no network)",
    "integration: multi-component tests, may need local data",
    "scientific: model-behaviour and calibration tests",
    "leakage: temporal-leakage and anti-fabrication tests",
    "reproducibility: determinism, fingerprint and equivalence tests",
    "performance: benchmarks and timing tests (may be slow)",
    "regression: historical regression pins (legacy engines/versions)",
    "data_integrity: manifest, registry and dataset-consistency tests",
    "statistical: sampling-noise-sensitive tests (need PYTHONHASHSEED=0 and/or large N)",
    "optional_data: requires optional data sources (e.g. FastF1) or full canonical data",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]