repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.2.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, tsx, typescript, json, css, markdown]
        additional_dependencies: [prettier-plugin-tailwindcss]

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint
        language: node
        types: [javascript, jsx, tsx, typescript]
        pass_filenames: true
        always_run: false